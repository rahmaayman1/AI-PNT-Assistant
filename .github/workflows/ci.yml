name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (catch syntax errors and undefined names)
        run: |
          flake8 src/ main.py --select=E9,F63,F7,F82 --show-source

      - name: Verify all modules import correctly
        run: |
          python -c "
          import src.feature_engineering.satellite_baseline
          import src.feature_engineering.rolling_features
          import src.feature_engineering.feature_pipeline
          import src.detection_model.model
          import src.switching_logic.decision_engine
          import src.pnt_engine.tdoa
          import src.pnt_engine.trilateration
          import src.pnt_engine.kalman_filter
          import src.signal_acquisition.file_source
          import src.signal_acquisition.source_factory
          import src.network_acquisition.mock_station_source
          import src.network_acquisition.station_source_factory
          print('All modules imported successfully')
          "

      - name: Run unit tests (no external data/model required)
        run: |
          python -m tests.test_switching_logic
          python -m tests.test_network_acquisition